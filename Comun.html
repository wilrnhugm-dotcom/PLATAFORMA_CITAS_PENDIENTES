const $ = id => document.getElementById(id);

function esc(v) {
 return String(v==null?'':v).replace(
  /[&<>"']/g,c=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  })[c]
 );
}

function aviso(texto) {
 const t=$('toast');

 t.textContent=texto;
 t.classList.remove('hidden');
 MOV.toast(t);

 clearTimeout(window.ugmToast);

 window.ugmToast=setTimeout(
  ()=>MOV.ocultar(t,()=>t.classList.add('hidden')),
  6500
 );
}

function api(funcion,...args) {
 return new Promise((resolve,reject)=>{
  if(!window.google ||
     !google.script ||
     !google.script.run) {
   reject(Error(
    'Abre la aplicación desde Google Apps Script.'
   ));
   return;
  }

  google.script.run
   .withSuccessHandler(r=>{
    if(/^(sincronizar|tablero)/.test(funcion)&&window.MOV&&MOV.sync)MOV.sync();
    resolve(r);
   })
   .withFailureHandler(e=>reject(
    Error(e&&e.message?e.message:String(e))
   ))[funcion](...args);
 });
}

function mostrarError(error) {
 const original=String(
  error&&error.message?error.message:error
 );

 const codigos=Object.keys(ERRORES_GRANDES);

 let codigo='';

 for(const c of codigos) {
  if(original.includes(c+'|')) {
   codigo=c;
   break;
  }
 }

 if(!codigo) {
  aviso(original);
  return;
 }

 const texto=original.split(codigo+'|').pop();

 $('errorTitle').textContent=
  ERRORES_GRANDES[codigo];

 $('errorText').textContent=texto;

 $('errorOverlay').classList.remove('hidden');
 MOV.error();
 $('btnCloseError').focus();
}

function cerrarError() {

function hoy() {
 const partes=new Intl.DateTimeFormat('en-US',{
  timeZone:'America/El_Salvador',
  year:'numeric',
  month:'2-digit',
  day:'2-digit'
 }).formatToParts(new Date());

 const p={};

 partes.forEach(x=>p[x.type]=x.value);

 return `${p.year}-${p.month}-${p.day}`;
}

function diaSemana(fecha) {
 if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha||'')){
  return '';
 }

 const n=new Date(
  fecha+'T12:00:00Z'
 ).getUTCDay();

 return n===6?'SABADO':n===0?'DOMINGO':'SEMANA';
}

function formatearDUI(v) {
 const digitos=String(v||'')
  .replace(/\D/g,'').slice(0,9);

 return digitos.length>8
  ?digitos.slice(0,8)+'-'+digitos.slice(8)
  :digitos;
}

function normalizarDUI(v) {
 const digitos=String(v||'')
  .replace(/\.0+$/,'')
  .replace(/\D/g,'');

 const nueve=digitos.length===8
  ?'0'+digitos:digitos;

 return nueve.length===9
  ?nueve.slice(0,8)+'-'+nueve.slice(8)
  :'';
}

function normTexto(v) {
 return String(v==null?'':v)
  .normalize('NFD')
  .replace(/[̀-ͯ]/g,'')
  .toUpperCase()
  .replace(/[^A-Z0-9 ]/g,' ')
  .replace(/\s+/g,' ')
  .trim();
}

function alfaNum(v) {
 return normTexto(v).replace(/ /g,'');
}

function resaltar(texto,consulta) {
 const limpio=esc(texto);
 const palabras=normTexto(consulta).split(' ')
  .filter(x=>x.length>=2);

 if(!palabras.length)return limpio;

 // Resalta sobre el texto sin acentos, conservando
 // el original.
 const base=String(texto).normalize('NFD')
  .replace(/[̀-ͯ]/g,'').toUpperCase();

 if(base.length!==String(texto).length)return limpio;

 const marcas=new Array(base.length).fill(false);

 palabras.forEach(x=>{
  let i=base.indexOf(x);
  while(i>=0) {
   for(let k=i;k<i+x.length;k++)marcas[k]=true;
   i=base.indexOf(x,i+x.length);
  }
 });

 let html='';
 let abierta=false;

 [...String(texto)].forEach((c,i)=>{
  if(marcas[i]&&!abierta){html+='<mark>';abierta=true;}
  if(!marcas[i]&&abierta){html+='</mark>';abierta=false;}
  html+=esc(c);
 });

 return html+(abierta?'</mark>':'');
}

function especialidadCatalogo(nombre) {
 const n=normTexto(nombre);
 return ESPECIALIDADES.find(e=>normTexto(e)===n)||'';
}

function nombreColumna(v) {
 return String(v==null?'':v)
  .trim().normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'')
  .replace(/[^A-Za-z0-9]/g,'')
  .toUpperCase();
}

  'IDCITA','NUMEROCITA','CORRELATIVO'

function formatoFechaExcel(valor) {
 if(valor instanceof Date) {
  if(isNaN(valor.getTime()))return '';

  return [
   valor.getFullYear(),
   String(valor.getMonth()+1).padStart(2,'0'),
   String(valor.getDate()).padStart(2,'0')
  ].join('-');
 }

 if(typeof valor==='number' && window.XLSX) {
  const f=XLSX.SSF.parse_date_code(valor);

  if(f) {
   return `${f.y}-${String(f.m).padStart(2,'0')}`+
    `-${String(f.d).padStart(2,'0')}`;
  }
 }

 const texto=String(valor||'').trim();

 let m=texto.match(
  /^(\d{4})-(\d{1,2})-(\d{1,2})/
 );

 if(m) {
  return `${m[1]}-${m[2].padStart(2,'0')}`+
   `-${m[3].padStart(2,'0')}`;
 }

 m=texto.match(
  /^(\d{1,2})\/(\d{1,2})\/(\d{4})/
 );

 if(m) {
  return `${m[3]}-${m[2].padStart(2,'0')}`+
   `-${m[1].padStart(2,'0')}`;
 }

 return '';
}

// "10553-25 - MARIA ORTIZ" -> "MARIA ORTIZ"
function limpiarNombrePaciente(v) {
 return String(v==null?'':v)
  .replace(/^\s*\d[\d\-\/]*\s*-\s*/,'').trim();
}

// El Reporte de Citas del sistema tiene Fecha/Hora,
// Especialidad y Estado Cita.
function esReporteCitas(fila) {
 const n=(fila||[]).map(nombreColumna);
 return n.includes('ESTADOCITA')||
  (n.includes('FECHAHORA')&&n.includes('ESPECIALIDAD'));
}

function detectarEncabezados(fila) {
 const campos={};

 Object.entries(ALIAS_COLUMNAS).forEach(
  ([campo,alternativas])=>{
   const i=fila.findIndex(c=>
    alternativas.includes(nombreColumna(c))
   );

   if(i>=0)campos[campo]=i;
  }
 );

 if(
  campos.fecha===undefined ||
  campos.especialidad===undefined ||
  campos.estado===undefined
 ) {
  return null;
 }

 return campos;
}

async function leerLibro(origen) {
 if(!window.XLSX) {
  throw Error(
   'No pudo cargarse el lector Excel. '+
   'Comprueba tu conexión.'
  );
 }

 if(typeof origen.texto==='string') {
  // raw: conserva el texto tal cual (ceros
  // iniciales y fechas dd/mm/aaaa).
  return XLSX.read(origen.texto,{
   type:'string',
   raw:true
  });
 }

 const buffer=await origen.arrayBuffer();

 return XLSX.read(buffer,{
  type:'array',
  cellDates:true
 });
}

async function procesarExcel(archivo) {
 const libro=await leerLibro(archivo);

 let mejor=null;
 let total=0;

 // Se revisan todas las hojas hasta encontrar
 // encabezados reconocibles.
 for(const nombre of libro.SheetNames) {
  const hoja=libro.Sheets[nombre];

  const matriz=XLSX.utils.sheet_to_json(
   hoja,{
    header:1,
    defval:'',
    raw:true,
    blankrows:false
   }
  );

  for(let i=0;i<Math.min(25,matriz.length);i++) {
   const campos=detectarEncabezados(matriz[i]);

   if(campos) {
    const cantidad=matriz.length-i-1;

    if(!mejor || cantidad>total) {
     mejor={matriz,inicio:i+1,campos};
     total=cantidad;
    }
   }
  }
 }

 if(!mejor) {
  throw Error(
   'ARCHIVO_EQUIVOCADO|Este archivo no es el Reporte de Citas '+
   'del sistema hospitalario (no tiene las columnas Fecha/Hora, '+
   'Especialidad y Estado Cita). Si es la base de pacientes que '+
   'envía Reportería, cárgala en "Base de pacientes".'
  );
 }

 const registros=[];

 const {matriz,inicio,campos}=mejor;

 for(let i=inicio;i<matriz.length;i++) {
  const fila=matriz[i];

  if(!fila || !fila.some(x=>
   x!=='' && x!==null && x!==undefined
  ))continue;

  function valor(campo) {
   const indice=campos[campo];

   return indice===undefined
    ?''
    :fila[indice];
  }

  registros.push({
   id:String(valor('id')??''),
   fecha:formatoFechaExcel(valor('fecha')),
   especialidad:String(
    valor('especialidad')??''
   ),
   estado:String(valor('estado')??''),
   documento:String(
    valor('documento')??''
   ),
   paciente:limpiarNombrePaciente(valor('paciente')),
   creacion:formatoFechaExcel(valor('creacion'))
  });
 }

 return registros;
}

async function archivoBase64(archivo) {
 const buffer=await archivo.arrayBuffer();

 if(buffer.byteLength>5*1024*1024) {
  throw Error('Archivo mayor de 5 MB.');
 }

 const bytes=new Uint8Array(buffer);
 let binario='';

 for(let i=0;i<bytes.length;i+=8192) {
  binario+=String.fromCharCode(
   ...bytes.subarray(i,i+8192)
  );
 }

 return btoa(binario);
}

/* =====================================================
   SCROLLTRIGGER: aparición al hacer scroll, encabezado,
   barra de progreso y paralaje suave del fondo.
   ===================================================== */

const ST=MOV.ok&&window.ScrollTrigger?ScrollTrigger:null;

if(MOV.ok) {
 gsap.ticker.lagSmoothing(500,33);
 if(ST)gsap.registerPlugin(ScrollTrigger);
}

Object.assign(MOV,{
 // Aparición escalonada a medida que entran en pantalla.
 revelar(elementos) {
  const lista=Array.from(elementos||[]).filter(el=>
   el&&!el.dataset.revelado&&el.offsetParent!==null
  );

  if(!lista.length)return;

  lista.forEach(el=>{el.dataset.revelado='1';});

  if(!MOV.ok)return;

  if(!ST) {
   MOV.escalonar(lista,lista.length);
   return;
  }

  gsap.set(lista,{opacity:0,y:26});

  ScrollTrigger.batch(lista,{
   start:'top 94%',
   once:true,
   onEnter:lote=>gsap.to(lote,{
    opacity:1,y:0,duration:.6,stagger:.07,
    ease:'power3.out',overwrite:true,
    clearProps:'transform,opacity'
   })
  });

  // Seguridad: nada queda invisible si no hubo scroll.
  setTimeout(()=>{
   lista.forEach(el=>{
    if(el.getBoundingClientRect().top<innerHeight&&
       getComputedStyle(el).opacity==='0') {
     gsap.to(el,{opacity:1,y:0,duration:.4,
      clearProps:'transform,opacity'});
    }
   });
  },1800);
 },

 // Reinicia las apariciones al cambiar de sección.
 reiniciarRevelado(raiz) {
  (raiz||document).querySelectorAll('[data-revelado]').forEach(el=>{
   delete el.dataset.revelado;
   if(MOV.ok)gsap.set(el,{clearProps:'transform,opacity'});
  });
 },

 // Ejecuta fn cuando el elemento se vuelve visible.
 alVer(el,fn) {
  if(!ST||!el) {fn();return;}
  const r=el.getBoundingClientRect();
  if(r.top<innerHeight*.95&&r.bottom>0) {fn();return;}
  ScrollTrigger.create({trigger:el,start:'top 92%',once:true,onEnter:fn});
 },

 // Número que entra deslizándose al cambiar.
 cifra(el) {
  if(!MOV.ok||!el)return;
  gsap.fromTo(el,{yPercent:-45,opacity:0},{
   yPercent:0,opacity:1,duration:.45,ease:'back.out(2.2)',
   clearProps:'transform,opacity'
  });
 },

 sacudir(el) {
  if(!MOV.ok||!el)return;
  gsap.fromTo(el,{x:-8},{x:0,duration:.7,ease:'elastic.out(1,.28)',
   clearProps:'transform'});
 },

 // Encabezado, barra de progreso y fondo con el scroll.
 desplazamiento() {
  // Encabezado compacto (simple y sin depender de GSAP).
  let compacto=false;
  window.addEventListener('scroll',()=>{
   const c=scrollY>12;
   if(c===compacto)return;
   compacto=c;
   document.querySelectorAll('.top')
    .forEach(t=>t.classList.toggle('scrolled',c));
  },{passive:true});

  if(!ST)return;

  const barra=document.querySelector('.scroll-progress span');

  if(barra) {
   gsap.to(barra,{scaleX:1,ease:'none',
    scrollTrigger:{start:0,end:'max',scrub:.4}});
  }

  gsap.to('.bg-orbs',{y:-140,ease:'none',
   scrollTrigger:{start:0,end:'max',scrub:1.2}});
 },

 refrescarScroll() {
  if(ST)requestAnimationFrame(()=>ScrollTrigger.refresh());
 },

 // Recalcula ScrollTrigger cuando cambia el alto de la
 // página (datos nuevos, cambio de sección).
 vigilarAlto() {
  if(!ST||!window.ResizeObserver)return;
  let alto=0;
  let espera=null;
  new ResizeObserver(()=>{
   const h=document.documentElement.scrollHeight;
   if(Math.abs(h-alto)<4)return;
   alto=h;
   clearTimeout(espera);
   espera=setTimeout(()=>ScrollTrigger.refresh(),120);
  }).observe(document.body);
 }
});

/* =====================================================
   SISTEMA DE MOVIMIENTO V3
   Criterios: movimiento solo cuando responde a una acción
   o a un cambio real de datos; curvas y tiempos únicos
   para toda la plataforma; solo transform y opacity (lo
   que la tarjeta gráfica mueve sin repintar); nada en
   bucle salvo indicadores "en vivo"; todo se apaga con
   "reducir movimiento" y cuando la pestaña no está visible.
   ===================================================== */

const MOV_T={rapido:.16,base:.28,lento:.46,curva:'expo.out',salida:'power2.in'};

if(MOV.ok) {
 gsap.defaults({ease:MOV_T.curva,duration:MOV_T.base});
 // Sin trabajo de animación con la pestaña oculta.
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden)gsap.globalTimeline.pause();
  else gsap.globalTimeline.resume();
 });
}

Object.assign(MOV,{
 // El fondo ya no se anima con JavaScript: CSS mueve una

 fondo() {},
 constelacion() {},
 tarjetas3D() {},
 magneticos() {},
 iconosVivos() {},
 confeti() {},

 // Reflejo sobre la tarjeta de acceso: una sola pasada.

   {xPercent:320,duration:1.4,ease:'power2.inOut',delay:.6});
 },

  gsap.fromTo(el,
   {clipPath:'inset(0 0 100% 0)',y:14},

 destello(el) {

 },

 vivo(el) {

 // Línea fina bajo el encabezado cada vez que llegan datos.
 sync() {

 // Luz que sigue al cursor en indicadores y tarjetas.
 // Se actualiza una vez por fotograma como máximo.
 luz() {
  if(!MOV.ok||!matchMedia('(pointer:fine)').matches)return;
  const sel='.kpi, .card, .cita, .pac-dia, .login-card';
  let actual=null,px=0,py=0,pendiente=false;

  const pintar=()=>{
   pendiente=false;
   if(!actual)return;
   const r=actual.getBoundingClientRect();
   actual.style.setProperty('--mx',(px-r.left)+'px');
   actual.style.setProperty('--my',(py-r.top)+'px');
  };

  document.addEventListener('pointermove',e=>{
   const el=e.target.closest&&e.target.closest(sel);
   if(el!==actual) {
    if(actual)actual.classList.remove('luz');
    actual=el;
    if(el)el.classList.add('luz');
   }
   px=e.clientX;py=e.clientY;
   if(actual&&!pendiente) {pendiente=true;requestAnimationFrame(pintar);}
  },{passive:true});

  document.addEventListener('pointerleave',()=>{
   if(actual)actual.classList.remove('luz');
   actual=null;
  });
 },

// Números: además del conteo, destello en su indicador.
(()=>{
 const numero=MOV.numero;
 MOV.numero=function(el,valor){

// Movimiento de entrada de listas: solo lo que se ve en
// pantalla entra escalonado; lo demás ya está en su sitio
// (así una lista larga nunca queda invisible ni pesa).
MOV.revelar=function(elementos) {
 const lista=Array.from(elementos||[]).filter(el=>
  el&&!el.dataset.revelado);
 if(!lista.length)return;
 lista.forEach(el=>{el.dataset.revelado='1';});
 if(!MOV.ok)return;

 const alto=innerHeight;
 const visibles=lista.filter(el=>{
  if(el.offsetParent===null)return false;
  const r=el.getBoundingClientRect();
  return r.bottom>0&&r.top<alto;
 }).slice(0,12);

 if(!visibles.length)return;
 gsap.fromTo(visibles,{opacity:0,y:10},
  {opacity:1,y:0,duration:.42,stagger:.035,
   overwrite:true,clearProps:'transform,opacity'});
};

MOV.escalonar=function(els,max) {
 if(!MOV.ok)return;
 const lista=Array.from(els).slice(0,max||12);
 if(!lista.length)return;
 gsap.fromTo(lista,{y:8,opacity:0},
  {y:0,opacity:1,stagger:.03,duration:.36,overwrite:true,
   clearProps:'transform,opacity'});
};

// Barra de progreso y encabezado compacto con el scroll.
// (Sin paralaje del fondo: repintaba toda la pantalla.)
MOV.desplazamiento=function() {
 let compacto=false;
 window.addEventListener('scroll',()=>{
  const c=scrollY>12;
  if(c===compacto)return;
  compacto=c;
  document.querySelectorAll('.top')
   .forEach(t=>t.classList.toggle('scrolled',c));
 },{passive:true});

 if(!ST)return;
 const barra=document.querySelector('.scroll-progress span');
 if(barra) {
  gsap.to(barra,{scaleX:1,ease:'none',
   scrollTrigger:{start:0,end:'max',scrub:.3}});
 }
};

const ORIGENES={
 AGENDA:{
  nombre:'Base HIS',
  icono:'calendario',
  detalle:'Cita previa: ya estaba agendada en el HIS antes del 1 de octubre.'
 },
 ADICIONAL:{
  nombre:'Extraordinario',
  icono:'llamada',
  detalle:'Reportería lo agendó o reagendó para fin de semana: cita creada desde el 1 de octubre, Aumento 10% o sin cita en la agenda del HIS.'
 },
 SOBRECUPO:{
  nombre:'Sobrecupo',
  icono:'agregar',
  detalle:'Registrado como sobrecupo por un técnico en esta plataforma.'
 }
};

const ORDEN_ORIGENES=['AGENDA','ADICIONAL','SOBRECUPO'];

function origenCita(c) {
 if(c.origen==='SOBRECUPO'||c.sobrecupo)return 'SOBRECUPO';
 if(c.extraordinario||c.origen==='REPORTERIA'||c.aumento)return 'ADICIONAL';
 return 'AGENDA';
}

// Por qué es extraordinario (para títulos y reportes).
function motivoExtra(c) {
 if(origenCita(c)!=='ADICIONAL')return '';
 return c.motivoExtra||(c.aumento?'Aumento 10%':'Sin cita en la agenda del HIS');
}

// ¿Viene en la base de Reportería? (incluye adicionales)
function deReporteria(c) {
 return Boolean(c.reporteria)||c.origen==='REPORTERIA';
}

// "sáb 10 oct · 07:00" para la cita de la base de Reportería.
function textoCitaBase(cita) {
 if(!cita||!cita.fecha)return '';
 const d=new Date(cita.fecha+'T12:00:00Z');
 const f=isNaN(d)?cita.fecha:d.toLocaleDateString('es-SV',
  {weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}).replace(/\./g,'');
 return f+(cita.hora?' · '+cita.hora:'');
}

function pildoraBase(cita) {
 const t=textoCitaBase(cita);
 return '<span class="origen o-'+(cita&&cita.aumento?'adicional':'reporteria')+
  '" title="Viene en la base de Reportería'+(t?': cita '+esc(t):'')+'">'+
  icono('llamada')+'<span>Reportería'+(t?' · '+esc(t):'')+'</span></span>';
}

function pildoraOrigen(c) {
 const o=origenCita(c);
 const O=ORIGENES[o];
 const nombre=o==='ADICIONAL'&&c.aumento?'Extraordinario · Aumento 10%':O.nombre;
 const motivo=motivoExtra(c);
 const titulo=O.detalle+(motivo?' Motivo: '+motivo+'.':'')+
  (o==='AGENDA'&&deReporteria(c)?' También viene en la base de Reportería (llamada de confirmación).':'');
 return '<span class="origen o-'+o.toLowerCase()+'" title="'+esc(titulo)+'">'+
  icono(O.icono)+'<span>'+esc(nombre)+'</span>'+
  (o==='AGENDA'&&deReporteria(c)?'<i class="o-call" aria-label="Confirmado por Reportería">'+icono('llamada')+'</i>':'')+
  '</span>';
}

// Iniciales: primer nombre y primer apellido.
function iniciales(nombre) {
 const p=String(nombre||'').trim().split(/\s+/)
  .filter(x=>/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(x));
 const segunda=p.length>=4?p[2]:p.length===3?p[1]:p[1];
 return ((p[0]||'?')[0]+((segunda||'')[0]||''))
  .toUpperCase();
}

// "martes, 13 de octubre de 2026"
function fechaLarga(f) {
 const d=new Date(String(f)+'T12:00:00Z');
 if(isNaN(d.getTime()))return String(f||'');
 return d.toLocaleDateString('es-SV',{
  weekday:'long',day:'numeric',month:'long',
  year:'numeric',timeZone:'UTC'
 });
}

function horaCorta(iso) {
 const d=new Date(iso);
 if(isNaN(d.getTime()))return '';
 return d.toLocaleTimeString('es-SV',{
  timeZone:'America/El_Salvador',
  hour:'2-digit',minute:'2-digit'
 });
}

function fechaHora(iso) {
 const d=new Date(iso);
 if(isNaN(d.getTime()))return String(iso||'');
 return d.toLocaleString('es-SV',{
  timeZone:'America/El_Salvador',
  day:'2-digit',month:'2-digit',
  hour:'2-digit',minute:'2-digit'
 });
}

function hace(segundos) {
 if(segundos==null)return '';
 if(segundos<60)return 'hace '+segundos+' s';
 if(segundos<3600)return 'hace '+Math.floor(segundos/60)+' min';
 return 'hace '+Math.floor(segundos/3600)+' h';
}

function claseEstado(estado) {
 const e=normTexto(estado);
 return e==='EN GESTION'?'gestion':
  e==='REGISTRADO'?'registrado':
  e==='RECHAZADO'?'rechazado':
  e==='ANULADO'?'anulado':
  e==='OBSERVADO'?'observado':
  e==='VALIDACION'?'validacion':'pendiente';
}

function textoEstado(estado) {
 const e=normTexto(estado);
 return {
  'PENDIENTE':'Sin verificar',
  'EN GESTION':'En gestión',
  'VALIDACION':'En validación (otra área)',
  'OBSERVADO':'Observado',
  'REGISTRADO':'Agendado',
  'RECHAZADO':'Rechazado',
  'ANULADO':'Anulado'
 }[e]||estado||'Pendiente';
}

function etiquetaEstado(estado) {
 return '<span class="estado '+claseEstado(estado)+'">'+
  esc(textoEstado(estado))+'</span>';
}

}

// Reduce fotos grandes (máx. 1800 px) para subirlas
// rápido. PDF se envía tal cual. Máximo 5 MB.
async function prepararArchivo(archivo) {
 if(!archivo)return null;

 const permitidos=[
  'image/png','image/jpeg',
  'image/webp','application/pdf'
 ];

 if(!permitidos.includes(archivo.type)) {
  throw Error('Formato no permitido. Usa JPG, PNG, WEBP o PDF.');
 }

 let blob=archivo;
 let mime=archivo.type;

 if(mime.startsWith('image/')&&archivo.size>600*1024&&
    window.createImageBitmap) {
  try {
   const bmp=await createImageBitmap(archivo);
   const k=Math.min(1,1800/Math.max(bmp.width,bmp.height));
   const c=document.createElement('canvas');
   c.width=Math.round(bmp.width*k);
   c.height=Math.round(bmp.height*k);
   c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
   const reducido=await new Promise(r=>
    c.toBlob(r,'image/jpeg',.85)
   );
   if(reducido&&reducido.size<archivo.size) {
    blob=reducido;
    mime='image/jpeg';
   }
  }catch(e){}
 }

 if(blob.size===0||blob.size>5*1024*1024) {
  throw Error('El archivo debe pesar menos de 5 MB.');
 }

 return {
  nombre:archivo.name,
  mime,
  base64:await archivoBase64(blob)
 };
}

// Con "campo" el diálogo pide un texto y resuelve con él
// (o false si se cancela): {etiqueta, placeholder, minimo}.
function dialogo({titulo,html,ok,cancelar,tipo,icono:icono_,campo}) {
 return new Promise(resolver=>{
  $('modalContent').innerHTML=`
   <div class="aviso-dia ${tipo||''}">
    <div class="aviso-ico">${icono(icono_||'estetoscopio')}</div>
    <h2>${titulo}</h2>
    ${html}
    ${campo?`<div class="field dlg-campo">
     <label for="dlgTexto">${campo.etiqueta||'Motivo'}</label>
     <textarea id="dlgTexto" rows="3" maxlength="300"
      placeholder="${campo.placeholder||''}"></textarea>
     <small class="dlg-cuenta" id="dlgCuenta">0 / ${campo.minimo||1} caracteres mínimos</small>
    </div>`:''}
    <div class="buttons">
     ${cancelar?`<button class="btn" id="dlgNo" type="button">${cancelar}</button>`:''}
     <button class="btn primary" id="dlgSi" type="button">${ok}</button>
    </div>
   </div>`;

  $('modal').classList.remove('hidden');
  MOV.modal();

  if(MOV.ok)gsap.fromTo('.aviso-ico',{scale:.7,opacity:0},
   {scale:1,opacity:1,duration:.5,ease:'back.out(1.6)',delay:.06});

  const fin=v=>{
   $('modal').classList.add('hidden');
   $('modalContent').innerHTML='';
   resolver(v);
  };

  if(campo) {
   const minimo=campo.minimo||1;
   const caja=$('dlgTexto');
   const revisar=()=>{
    const n=caja.value.trim().length;
    $('dlgCuenta').textContent=n+' / '+minimo+' caracteres mínimos';
    $('dlgCuenta').classList.toggle('ok',n>=minimo);
    $('dlgSi').disabled=n<minimo;
   };
   caja.addEventListener('input',revisar);
   revisar();
   $('dlgSi').onclick=()=>{
    const v=caja.value.trim();
    if(v.length<minimo) {MOV.pulso(caja);return;}
    fin(v);
   };
   if($('dlgNo'))$('dlgNo').onclick=()=>fin(false);
   caja.focus();
   return;
  }

  $('dlgSi').onclick=()=>fin(true);
  if($('dlgNo'))$('dlgNo').onclick=()=>fin(false);
  $('dlgSi').focus();
 });
}

/* =====================================================
   CONFIRMACIÓN PROPIA (reemplaza al confirm() del
   navegador, que en Apps Script muestra "Una página
   incorporada en ...googleusercontent.com dice").
   Va en su propia capa, así no cierra la ventana que
   esté abierta debajo (por ejemplo, el detalle de una
   solicitud).
   ===================================================== */

function confirmar({titulo,html,ok,cancelar,tipo,icono:icono_}) {
 return new Promise(resolver=>{
  const capa=document.createElement('div');
  capa.className='overlay confirma';
  capa.setAttribute('role','dialog');
  capa.setAttribute('aria-modal','true');
  capa.innerHTML=`
   <div class="modal glass confirma-caja">
    <div class="aviso-dia ${tipo||'bloqueo'}">
     <div class="aviso-ico">${icono(icono_||'alerta')}</div>
     <h2>${titulo}</h2>
     ${html||''}
     <div class="buttons">
      <button class="btn" type="button" data-r="no">${cancelar||'Cancelar'}</button>
      <button class="btn ${tipo==='info'?'primary':'danger'}" type="button" data-r="si">${ok||'Aceptar'}</button>
     </div>
    </div>
   </div>`;

  document.body.appendChild(capa);

  const fin=v=>{
   document.removeEventListener('keydown',tecla,true);
   const quitar=()=>{capa.remove();resolver(v);};
   if(!MOV.ok){quitar();return;}
   gsap.to(capa,{opacity:0,duration:.18,onComplete:quitar});
  };

  const tecla=ev=>{
   if(ev.key==='Escape'){ev.stopPropagation();fin(false);}
  };
  document.addEventListener('keydown',tecla,true);

  capa.addEventListener('click',ev=>{
   if(ev.target===capa){fin(false);return;}
   const b=ev.target.closest('[data-r]');
   if(b)fin(b.dataset.r==='si');
  });

  if(MOV.ok) {
   gsap.fromTo(capa,{opacity:0},{opacity:1,duration:.2});
   gsap.fromTo(capa.querySelector('.confirma-caja'),
    {y:20,scale:.94,opacity:0},
    {y:0,scale:1,opacity:1,duration:.36,ease:'expo.out'});
   gsap.fromTo(capa.querySelector('.aviso-ico'),{scale:.7,opacity:0},
    {scale:1,opacity:1,duration:.5,ease:'back.out(1.6)',delay:.06});
  }

  capa.querySelector('[data-r="no"]').focus();
 });
}

/* =====================================================
   ZONAS DE ARCHIVO (arrastrar, clic o pegar)
   ===================================================== */

function montarZona(zona,input,alElegir) {
 zona.addEventListener('click',ev=>{
  if(ev.target.closest('.quitar'))return;
  input.click();
 });

 zona.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'||ev.key===' ') {
   ev.preventDefault();
   input.click();
  }
 });

 input.addEventListener('change',ev=>{
  alElegir(ev.target.files[0]);
  input.value='';
 });

 zona.addEventListener('dragover',ev=>{
  ev.preventDefault();
  zona.classList.add('dragging');
 });

 zona.addEventListener('dragleave',()=>{
  zona.classList.remove('dragging');
 });

 zona.addEventListener('drop',ev=>{
  ev.preventDefault();
  zona.classList.remove('dragging');
  alElegir(ev.dataTransfer.files[0]);
 });
}

// Ctrl+V de un archivo o de celdas copiadas de Excel.
function pegarComoTabla(ev,importar) {
 const t=ev.target;

 if(t&&['INPUT','TEXTAREA','SELECT']
   .includes(t.tagName))return false;

 const cd=ev.clipboardData;

 if(!cd)return false;

 const archivo=Array.from(cd.files||[]).find(f=>
  /\.(xlsx|xls|csv|txt)$/i.test(f.name||'')
 );

 if(archivo) {
  ev.preventDefault();
  importar(archivo);
  return true;
 }

 const texto=cd.getData('text/plain')||'';

 if(/[\t;,]/.test(texto)&&/\n/.test(texto.trim())) {
  ev.preventDefault();
  importar({name:'Pegado desde portapapeles',texto});
  return true;
 }

 return false;
}

function imagenPegada(ev) {
 const items=Array.from(
  (ev.clipboardData&&ev.clipboardData.items)||[]
 );

 const item=items.find(x=>
  x.kind==='file'&&x.type.startsWith('image/')
 );

 if(!item)return null;

 const archivo=item.getAsFile();

 if(!archivo)return null;

 const ext=archivo.type==='image/jpeg'?'jpg':
  archivo.type==='image/webp'?'webp':'png';

 return new File([archivo],
  'captura_'+Date.now()+'.'+ext,{type:archivo.type});
}

/* =====================================================
   AGENDA EXCEL (compartida)
   ===================================================== */

async function importarAgendaArchivo(archivo,alTerminar) {
 if(!archivo||UGM.importando)return;

 UGM.importando=true;
 aviso('Procesando agenda Excel...');

 try {
  const registros=await procesarExcel(archivo);

  if(!registros.length) {
   throw Error('El archivo no contiene citas.');
  }

  const r=await api(
   'importarAgenda',UGM.token,registros,archivo.name
  );

  if(!r||!r.ok) {
   throw Error('El servidor no confirmó la importación.');
  }

  MOV.exito();
  aviso('Agenda actualizada: '+r.total+
   ' citas válidas. Omitidas: '+r.omitidas+'.'+
   (r.excluidas?' Medicina General no tomada en cuenta: '+r.excluidas+'.':'')+
   (r.conCreacion===0?' Atención: el archivo no trae la columna "Fecha Creación"; no se podrán separar los extraordinarios.':''));

  if(alTerminar)await alTerminar(r);

 }catch(e) {
  mostrarError(e);

 }finally {
  UGM.importando=false;
 }
}

/* =====================================================
   ACCESO Y CIERRE DE SESIÓN
   ===================================================== */

function salirLocal(mensaje,alSalir) {
 UGM.token='';
 UGM.nombre='';
 UGM.perfil='';
 UGM.sesion='';
 UGM.generacion++;

 if(alSalir)alSalir();

 $('loginForm').reset();
 $('who').textContent='';
 $('app').classList.add('hidden');
 $('login').classList.remove('hidden');
 $('modal').classList.add('hidden');
 $('modalContent').innerHTML='';
 cerrarError();
 MOV.login();

 if(mensaje)aviso(mensaje);
}

// Si supervisión cerró la sesión o venció, se vuelve
// al acceso.
function sesionTerminada(error,alSalir) {
 const m=String(error&&error.message||error);

 if(/Sesi[oó]n (cerrada|vencida|inv[aá]lida|no autorizada)|Inicia sesi[oó]n/
   .test(m)&&UGM.token) {
  salirLocal('Tu sesión terminó: '+m,alSalir);
  return true;
 }

 return false;
}

function montarAcceso(vista,alEntrar,alSalir) {
 $('loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault();

  const b=$('btnLogin');
  b.disabled=true;
  b.textContent='Ingresando...';

  try {
   const r=await api(
    'entrar',
    $('loginName').value,
    $('loginPass').value,
    vista
   );

   UGM.token=r.token;
   UGM.nombre=r.nombre;
   UGM.perfil=r.perfil;
   UGM.sesion=r.sesion||'';
   UGM.cerrando=false;
   UGM.generacion++;

   await MOV.salirLogin();

   $('login').classList.add('hidden');
   $('app').classList.remove('hidden');
   MOV.restaurarLogin();

   $('loginPass').value='';
   $('who').textContent=
    UGM.nombre+' · '+(ROLES[UGM.perfil]||UGM.perfil);

   await alEntrar(r);

  }catch(e) {
   aviso(e.message);

  }finally {
   b.disabled=false;
   b.textContent='Ingresar al sistema';
  }
 });

 $('btnSalir').addEventListener('click',async ev=>{
  ev.preventDefault();

  if(UGM.cerrando)return;

  UGM.cerrando=true;

  const token=UGM.token;

  salirLocal('',alSalir);

  try {
   if(token)await api('salir',token);
   aviso('Sesión cerrada.');
  }catch(e) {
   aviso('Se volvió al acceso, pero no se pudo '+
    'confirmar el cierre remoto.');
  }finally {
   UGM.cerrando=false;
  }
 });
}

function mostrarPagina(n,titulo,sinAnimar) {
 MOV.reiniciarRevelado($('app'));

 document.querySelectorAll('.page').forEach(el=>{
  el.classList.toggle('hidden',el.id!==n);
 });

 if(!sinAnimar)window.scrollTo({top:0,behavior:'smooth'});

 let activa=null;

 document.querySelectorAll('.nav').forEach(el=>{
  const on=el.dataset.page===n;
  el.classList.toggle('active',on);
  if(on)activa=el;
 });

 MOV.tinta(activa);
 navMovilEstado();

 $('title').textContent=titulo;
 $('crumbPage').textContent=titulo;

 if(!sinAnimar) {
  MOV.pagina($(n));
  MOV.titulo($('title'));
  MOV.revelar($(n).querySelectorAll(
   '.kpi, .panel, .card, .cola, .notice'
  ));
 }

 MOV.refrescarScroll();
}

/* =====================================================
   VISTA DE CELULAR
   - Menú inferior tipo aplicación con nombres cortos. Si hay
     más de 5 secciones, las secundarias van en "Más".
   - Las tablas se muestran como tarjetas (cada dato con su
     título), sin columnas cortadas.
   ===================================================== */

const NAV_CORTO={
 consultas:'Consultas',solicitud:'Sobrecupo',missolicitudes:'Solicitudes',
 buscar:'Buscar',control:'Control',solicitudes:'Bandeja',asistencia:'Asistencia',
 personal:'Personal',cupos:'Cupos',basepacientes:'Base',actualizacion:'Agenda',
 auditoria:'Auditoría'
};
const NAV_PRINCIPAL=['control','solicitudes','asistencia','actualizacion'];
const MOVIL=window.matchMedia('(max-width:720px)');

function montarNavMovil() {
 const barra=document.querySelector('.sidebar');
 if(!barra||barra.dataset.movil)return;
 barra.dataset.movil='1';

 const navs=[...barra.querySelectorAll('.nav[data-page]')];

 navs.forEach(b=>{
  // Texto largo (escritorio) y corto (celular) por separado.
  [...b.childNodes].forEach(n=>{
   if(n.nodeType===3&&n.textContent.trim()) {
    const t=document.createElement('span');
    t.className='nav-t';
    t.textContent=n.textContent.trim();
    n.replaceWith(t);
   }
  });
  const c=document.createElement('span');
  c.className='nav-c';
  c.textContent=NAV_CORTO[b.dataset.page]||
   (b.querySelector('.nav-t')||{}).textContent||'';
  const badge=b.querySelector('.badge');
  b.insertBefore(c,badge||null);
 });

 if(navs.length>5) {
  navs.forEach(b=>{
   if(!NAV_PRINCIPAL.includes(b.dataset.page))b.classList.add('nav-extra');
  });

  const mas=document.createElement('button');
  mas.type='button';
  mas.className='nav-mas';
  mas.id='navMas';
  mas.setAttribute('aria-expanded','false');
  mas.innerHTML=icono('mas')+'<span class="nav-c">Más</span>';
  barra.appendChild(mas);

  const cerrar=()=>{
   barra.classList.remove('mas');
   mas.setAttribute('aria-expanded','false');
  };

  mas.addEventListener('click',ev=>{
   ev.stopPropagation();
   const abrir=!barra.classList.contains('mas');
   barra.classList.toggle('mas',abrir);
   mas.setAttribute('aria-expanded',String(abrir));
  });
  navs.forEach(b=>b.addEventListener('click',cerrar));
  document.addEventListener('click',ev=>{
   if(!barra.contains(ev.target))cerrar();
  });
  barra.style.setProperty('--nav-cols',String(NAV_PRINCIPAL.length+1));
 }else {
  barra.style.setProperty('--nav-cols',String(navs.length));
 }

 navMovilEstado();
}

// "Más" queda resaltado si la sección abierta es secundaria.
function navMovilEstado() {
 const mas=$('navMas');
 if(!mas)return;
 const activa=document.querySelector('.nav.active');
 mas.classList.toggle('active',Boolean(activa&&activa.classList.contains('nav-extra')));
}

// Copia el título de cada columna a sus celdas para que, en
// celular, cada fila se lea como tarjeta.
function etiquetarTablas() {
 document.querySelectorAll('table').forEach(t=>{
  const th=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());
  if(!th.length)return;
  t.classList.add('t-resp');
  t.querySelectorAll('tbody tr').forEach(tr=>{
   if(tr.dataset.et===String(th.length))return;
   [...tr.children].forEach((td,i)=>{
    if(td.tagName==='TD'&&!td.hasAttribute('colspan'))td.setAttribute('data-label',th[i]||'');
   });
   tr.dataset.et=String(th.length);
  });
 });
}

function vigilarTablas() {
 let pendiente=false;
 const correr=()=>{
  pendiente=false;
  if(MOVIL.matches)etiquetarTablas();
 };
 new MutationObserver(()=>{
  if(pendiente||!MOVIL.matches)return;
  pendiente=true;
  requestAnimationFrame(correr);
 }).observe(document.body,{childList:true,subtree:true});
 if(MOVIL.addEventListener)MOVIL.addEventListener('change',correr);
 correr();
}

function montarComun() {
 iniciarTema();
 montarNavMovil();
 vigilarTablas();

 $('themeToggle').addEventListener('click',()=>{
  aplicarTema(
   document.body.classList.contains('light')
    ?'oscuro':'claro'
  );
 });

 $('btnCloseError').addEventListener('click',cerrarError);

 reloj();
 setInterval(reloj,1000);

 pintarIconos();

 MOV.login();
 MOV.fondo();
 MOV.brillo();
 MOV.desplazamiento();
 MOV.vigilarAlto();
 MOV.vida();

 window.addEventListener('resize',()=>{
  MOV.tinta(document.querySelector('.nav.active'));
 });
}
